<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="t" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">serverless-wiki-on-aws：あなたの AWS アカウントで動く Markdown の Wiki。ブラウザー、AI アシスタント、Claude のどこからでも編集でき、3 つとも同じ権限チェックを通ります。</title>
<rect width="1600" height="600" rx="32" fill="#0F2A3D"/>
<rect x="72" y="64" width="64" height="64" rx="16" fill="#F5A524"/>
<g transform="translate(84 76) scale(1.6667)" fill="none" stroke="#0F2A3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></g>
<text x="156" y="108" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">serverless-wiki-on-aws</text>
<text x="72" y="308" font-size="60" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan fill="#F5A524">あなたの</tspan> AWS アカウントで</text>
<text x="72" y="384" font-size="60" font-weight="700" fill="#FFFFFF" text-anchor="start">動く Markdown の Wiki。</text>
<text x="72" y="462" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">ブラウザー、AI アシスタント、Claude のどこからでも編集できます。</text>
<text x="72" y="502" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">3 つの入口は、同じ権限チェックを通ります。</text>
<text x="72" y="542" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">誰も使っていないあいだは、何も動いていません。</text>
<rect x="980" y="102" width="548" height="84" rx="18" fill="#18394F" stroke="#2B5470" stroke-width="2"/>
<g transform="translate(1008 126) scale(1.5000)" fill="none" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></g>
<text x="1064" y="154" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">ブラウザー</text>
<text x="1500" y="153" font-size="20" font-weight="400" fill="#9FB4C6" text-anchor="end">読む・編集・検索</text>
<rect x="980" y="206" width="548" height="84" rx="18" fill="#18394F" stroke="#2B5470" stroke-width="2"/>
