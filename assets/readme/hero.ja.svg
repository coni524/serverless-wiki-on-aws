<text x="1064" y="258" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">AI アシスタント</text>
<text x="1500" y="257" font-size="20" font-weight="400" fill="#9FB4C6" text-anchor="end">書く前に確認</text>
