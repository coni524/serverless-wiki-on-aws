<text x="156" y="108" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">serverless-wiki-on-aws</text>
<text x="72" y="232" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="start">A Markdown wiki that</text>
<text x="72" y="308" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="start">lives in <tspan fill="#F5A524">your own</tspan></text>
<text x="72" y="384" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="start">AWS account.</text>
<text x="72" y="462" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">Edit in the browser, with the AI assistant, or through Claude.</text>
<text x="72" y="502" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">One permission check guards all three.</text>
<text x="72" y="542" font-size="25" font-weight="400" fill="#C9D6E2" text-anchor="start">Nothing runs while nobody is reading.</text>
