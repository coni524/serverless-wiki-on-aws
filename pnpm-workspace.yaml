packages:
  - cdk-blocks
  - clients/*

allowBuilds:
  esbuild: true

patchedDependencies:
  '@aws-cdk-blocks/bb-lambda-compute@1.0.0': patches/@aws-cdk-blocks__bb-lambda-compute@1.0.0.patch

# The cdk-blocks/client.js that AWS CDK Blocks generates imports
# @aws-cdk-blocks/bb-* directly. Those are transitive dependencies of
# aws-cdk-blocks, which pnpm's strict node_modules layout does not resolve, so
# the @aws-cdk-blocks scope alone is hoisted to the root node_modules.
publicHoistPattern:
  - '@aws-cdk-blocks/*'
